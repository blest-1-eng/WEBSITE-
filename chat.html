<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYRA Chat</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="chat-container">

<div class="sidebar">

<h2>🤖 NYRA</h2>

<ul>

<li><i class="fa-solid fa-comment"></i> Chat</li>

<li><i class="fa-solid fa-brain"></i> Memory</li>

<li><i class="fa-solid fa-note-sticky"></i> Notes</li>

<li><i class="fa-solid fa-shield-halved"></i> Guardian</li>

<li><i class="fa-solid fa-gear"></i> Settings</li>

</ul>

</div>

<div class="chat-main">

<div class="chat-header">

<img src="https://cdn.discordapp.com/attachments/1533756900196225151/1533757248050823219/file_000000002a148211a3f1c5c32d47498f.png?ex=6a71a63f&is=6a7054bf&hm=73f89db669041b57da490740cd9d14847a8fb18f2993f94447181a9ec83c35b6&" class="chat-avatar">

<div>

<h2>NYRA AI</h2>

<p>Online</p>

</div>

</div>

<div class="messages" id="messages">

<div class="bot">

Hello 👋<br>

I'm NYRA.

</div>

</div>

<div class="input-box">

<input id="messageInput" type="text" placeholder="Message NYRA...">

<button id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

</div>

<script src="chat.js"></script>

</body>

</html>
